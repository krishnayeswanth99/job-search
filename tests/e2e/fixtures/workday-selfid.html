<!doctype html>
<html><head><meta charset="utf-8"><title>Self Identify</title></head>
<body>
<form>
  <!-- Prompt picker: search box cleared after a pick, choice shown as a pill -->
  <div data-automation-id="formField-countryPhoneCode">
    <label for="cpc">Country Phone Code</label>
    <div>
      <div data-automation-id="multiselectInputContainer"><input id="cpc" type="text" data-automation-id="searchBox"></div>
      <ul data-automation-id="selectedItemList"><li data-automation-id="selectedItem">United Kingdom (+44)</li></ul>
    </div>
  </div>
  <div data-automation-id="formField-name">
    <label for="selfIdentifiedDisabilityData--name">Name</label>
    <input id="selfIdentifiedDisabilityData--name" type="text">
  </div>
  <div data-automation-id="formField-dateSignedOn">
    <label>Date</label>
    <div role="group" id="selfIdentifiedDisabilityData--dateSignedOn">
      <label for="m" style="display:none">Month</label>
      <input id="selfIdentifiedDisabilityData--dateSignedOn-dateSectionMonth-input" role="spinbutton" aria-label="Month" data-automation-id="dateSectionMonth-input" type="text">
      <input id="selfIdentifiedDisabilityData--dateSignedOn-dateSectionDay-input" role="spinbutton" aria-label="Day" data-automation-id="dateSectionDay-input" type="text">
      <input id="selfIdentifiedDisabilityData--dateSignedOn-dateSectionYear-input" role="spinbutton" aria-label="Year" data-automation-id="dateSectionYear-input" type="text">
    </div>
  </div>
</form>
<script>
  // Like Workday: the date boxes only take digits typed as keystrokes; anything else is dropped.
  for (const el of document.querySelectorAll('[role="spinbutton"]')) {
    let keyed = false;
    el.addEventListener('keydown', (e) => { keyed = /^\d$/.test(e.key); });
    el.addEventListener('input', () => {
      if (!keyed || /\D/.test(el.value)) el.value = '';
      keyed = false;
      el.setAttribute('aria-valuenow', el.value);
    });
  }
</script>
</body></html>
