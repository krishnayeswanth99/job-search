<!doctype html><html><head><meta charset="utf-8"><title>Candidate Profile | Careers at Acme</title>
<style>#hear-list{position:absolute;background:#fff;border:1px solid #999;list-style:none;margin:0;padding:0}#hear-list li{padding:4px 8px;cursor:pointer}</style></head><body>
<h1>Candidate Profile</h1>
<form id="icims_form">
  <div class="iCIMS_TableRow"><label for="fn">First Name *</label><input id="fn" name="PersonProfileFields.FirstName" required></div>
  <div class="iCIMS_TableRow"><label for="ln">Last Name *</label><input id="ln" name="PersonProfileFields.LastName" required></div>
  <div class="iCIMS_TableRow"><label for="em">Email *</label><input id="em" type="email" name="PersonProfileFields.Email" required></div>
  <div class="iCIMS_TableRow"><label for="ph">Phone *</label><input id="ph" name="PhoneNumber"></div>
  <div class="iCIMS_TableRow"><label for="pt">Type</label><select id="pt" name="PhoneNumberType"><option value="">— Make a Selection —</option><option>Home</option><option>Mobile</option><option>Work</option></select></div>
  <div class="iCIMS_TableRow"><label for="hear">How did you hear about us?</label>
    <div class="iCIMS_Dropdown"><input id="hear" role="combobox" aria-controls="hear-list" aria-expanded="false" readonly placeholder="— Make a Selection —"></div>
    <ul id="hear-list" role="listbox" hidden>
      <li role="option" data-value="1">Company Website</li>
      <li role="option" data-value="2">Job Board - Indeed</li>
      <li role="option" data-value="3">Job Board - LinkedIn</li>
      <li role="option" data-value="4">Employee Referral</li>
    </ul>
  </div>
  <div class="iCIMS_TableRow"><label for="eid">Previous Acme Employee ID</label><input id="eid" name="PrevEmployeeID"></div>
  <div class="iCIMS_TableRow"><label for="cv">Resume *</label><input id="cv" type="file" name="resume"></div>
  <button type="button" id="next">Next</button>
</form>
<script>
  // Custom dropdown: opens on click, closes on outside click; choosing an option sets the input.
  const hear = document.getElementById('hear');
  const list = document.getElementById('hear-list');
  hear.addEventListener('click', () => { list.hidden = false; hear.setAttribute('aria-expanded', 'true'); });
  list.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li) return;
    hear.value = li.textContent;
    hear.dataset.value = li.dataset.value;
    list.hidden = true;
  });
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('#hear-list') && e.target !== hear) list.hidden = true; });
</script>
</body></html>
